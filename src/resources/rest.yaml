rest:
  # Style 1: direct REST -> function (no flow)
  - service: 'hello.direct'
    methods: ['GET']
    url: '/api/hello/direct/{name}'
    timeout: 10s
    cors: cors_1
    headers: header_1
    tracing: true

  # Style 2: REST -> http.flow.adapter -> flows/greetings.yml -> greeting.demo
  - service: 'http.flow.adapter'
    methods: ['GET']
    url: '/api/hello/flow/{user}'
    flow: 'greetings'
    timeout: 10s
    cors: cors_1
    headers: header_1
    tracing: true

cors:
  - id: cors_1
    options:
      - 'Access-Control-Allow-Origin: *'
      - 'Access-Control-Allow-Methods: GET, OPTIONS'
      - 'Access-Control-Allow-Headers: Origin, Content-Type'
      - 'Access-Control-Max-Age: 86400'
    headers:
      - 'Access-Control-Allow-Origin: *'

headers:
  - id: header_1
    response:
      add:
        - 'Cache-Control: no-cache, no-store'
